name: Publish personal TachiManga repo

on:
  push:
    branches:
      - main
    paths:
      - 'src/en/mangafire/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/publish-personal.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-tachimanga-repo
  cancel-in-progress: true

env:
  VERSION_NAME: 1.6.11
  VERSION_CODE: 106011
  APK_NAME: tachiyomi-en.mangafire-v1.6.11.apk
  APK_URL: https://raw.githubusercontent.com/WavyKisuke/extensions-source/repo/apk/tachiyomi-en.mangafire-v1.6.11.apk
  SOURCE_ID: 6084907896154116083

jobs:
  build-and-publish:
    name: Build and publish MangaFire
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format MangaFire source
        run: ./gradlew :src:en:mangafire:spotlessApply --no-daemon

      - name: Clean and build MangaFire debug APK
        run: ./gradlew :src:en:mangafire:clean :src:en:mangafire:assembleDebug --no-daemon --stacktrace

      - name: Verify APK identity and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src/en/mangafire/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK: $APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='eu.kanade.tachiyomi.extension.en.mangafire'" >/dev/null
          echo "$BADGING" | grep -F "versionCode='${VERSION_CODE}'" >/dev/null
          echo "$BADGING" | grep -F "versionName='${VERSION_NAME}'" >/dev/null

          CERT_OUTPUT="$($APKSIGNER verify --print-certs "$APK" 2>&1 || true)"
          echo "$CERT_OUTPUT"
          SIGNING_KEY_FINGERPRINT="$(printf '%s\n' "$CERT_OUTPUT" | grep -m1 -oE '[0-9A-Fa-f]{64}' || true)"
          test -n "$SIGNING_KEY_FINGERPRINT"
          echo "SIGNING_KEY_FINGERPRINT=$SIGNING_KEY_FINGERPRINT" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Prepare extension repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tachimanga-repo
          git clone --branch repo --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/tachimanga-repo

          cd /tmp/tachimanga-repo
          git fetch origin repo
          git checkout -B repo origin/repo
          find . -maxdepth 1 -type f -delete
          rm -rf apk
          mkdir -p apk
          cp "$GITHUB_WORKSPACE/$APK_PATH" "apk/${APK_NAME}"

          cat > index.json <<EOF
          [
            {
              "name": "MangaFire",
              "pkg": "eu.kanade.tachiyomi.extension.en.mangafire",
              "apk": "${APK_URL}",
              "lang": "en",
              "code": ${VERSION_CODE},
              "version": "${VERSION_NAME}",
              "nsfw": 1,
              "sources": [
                {
                  "name": "MangaFire",
                  "lang": "en",
                  "id": "${SOURCE_ID}",
                  "versionId": 1,
                  "baseUrl": "https://mangafire.to"
                }
              ]
            }
          ]
          EOF

          cp index.json index.min.json

          cat > repo.json <<EOF
          {
            "index_v2": null,
            "meta": {
              "name": "WavyKisuke MangaFire",
              "shortName": "MangaFire",
              "website": "https://github.com/WavyKisuke/extensions-source",
              "signingKeyFingerprint": "${SIGNING_KEY_FINGERPRINT}"
            }
          }
          EOF

          cat > README.md <<'EOF'
          # WavyKisuke TachiManga Extensions

          Personal TachiManga extension repository.

          Repository index: `https://raw.githubusercontent.com/WavyKisuke/extensions-source/repo/index.min.json`
          EOF

          git config user.name "WavyKisuke"
          git config user.email "327378209+WavyKisuke@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish MangaFire ${VERSION_NAME}"
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
