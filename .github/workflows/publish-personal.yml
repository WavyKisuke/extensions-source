name: Publish personal TachiManga repo

on:
  push:
    branches:
      - main
    paths:
      - 'src/en/mangafire/**'
      - 'src/en/batcave/**'
      - 'scripts/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/publish-personal.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-tachimanga-repo
  cancel-in-progress: false

env:
  MANGAFIRE_VERSION_NAME: 1.6.15
  MANGAFIRE_SOURCE_VERSION_CODE: 15
  MANGAFIRE_ANDROID_VERSION_CODE: 106015
  MANGAFIRE_APK_NAME: tachiyomi-en.mangafire-v1.6.15.apk
  MANGAFIRE_JAR_NAME: tachiyomi-en.mangafire-v1.6.15.jar
  MANGAFIRE_PACKAGE: eu.kanade.tachiyomi.extension.en.mangafire

  BATCAVE_VERSION_NAME: 1.6.19
  BATCAVE_SOURCE_VERSION_CODE: 19
  BATCAVE_ANDROID_VERSION_CODE: 106019
  BATCAVE_APK_NAME: tachiyomi-en.batcave-v1.6.19.apk
  BATCAVE_JAR_NAME: tachiyomi-en.batcave-v1.6.19.jar
  BATCAVE_PACKAGE: eu.kanade.tachiyomi.extension.en.batcave

jobs:
  build-and-publish:
    name: Build and publish MangaFire + BatCave
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install protobuf runtime
        run: python3 -m pip install --user protobuf

      - name: Format sources
        run: ./gradlew :src:en:mangafire:spotlessApply :src:en:batcave:spotlessApply --no-daemon

      - name: Build release APK and JAR packages
        run: ./gradlew :src:en:mangafire:clean :src:en:mangafire:assembleRelease :src:en:batcave:clean :src:en:batcave:assembleRelease --no-daemon --stacktrace

      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail
          MF_APK="$(find src/en/mangafire/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          MF_JAR="$(find src/en/mangafire/build/outputs/jar/release -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          BC_APK="$(find src/en/batcave/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          BC_JAR="$(find src/en/batcave/build/outputs/jar/release -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          test -n "$MF_APK" && test -n "$MF_JAR" && test -n "$BC_APK" && test -n "$BC_JAR"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          MF_BADGING="$($AAPT dump badging "$MF_APK")"
          BC_BADGING="$($AAPT dump badging "$BC_APK")"
          echo "$MF_BADGING"
          echo "$BC_BADGING"
          echo "$MF_BADGING" | grep -F "package: name='${MANGAFIRE_PACKAGE}'" >/dev/null
          echo "$MF_BADGING" | grep -F "versionCode='${MANGAFIRE_ANDROID_VERSION_CODE}'" >/dev/null
          echo "$BC_BADGING" | grep -F "package: name='${BATCAVE_PACKAGE}'" >/dev/null
          echo "$BC_BADGING" | grep -F "versionCode='${BATCAVE_ANDROID_VERSION_CODE}'" >/dev/null
          CERT_OUTPUT="$($APKSIGNER verify --print-certs "$MF_APK" 2>&1 || true)"
          SIGNING_KEY_FINGERPRINT="$(printf '%s\n' "$CERT_OUTPUT" | grep -m1 -oE '[0-9A-Fa-f]{64}' || true)"
          test -n "$SIGNING_KEY_FINGERPRINT"
          unzip -t "$MF_JAR" >/dev/null
          unzip -t "$BC_JAR" >/dev/null
          echo "SIGNING_KEY_FINGERPRINT=$SIGNING_KEY_FINGERPRINT" >> "$GITHUB_ENV"
          echo "MF_APK_PATH=$MF_APK" >> "$GITHUB_ENV"
          echo "MF_JAR_PATH=$MF_JAR" >> "$GITHUB_ENV"
          echo "BC_APK_PATH=$BC_APK" >> "$GITHUB_ENV"
          echo "BC_JAR_PATH=$BC_JAR" >> "$GITHUB_ENV"

      - name: Prepare TachiManga repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tachimanga-repo
          git clone --branch repo --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/tachimanga-repo
          cd /tmp/tachimanga-repo
          git fetch origin repo
          git checkout -B repo origin/repo
          find . -maxdepth 1 -type f -delete
          rm -rf apk jar
          mkdir -p apk jar
          cp "$GITHUB_WORKSPACE/$MF_APK_PATH" "apk/${MANGAFIRE_APK_NAME}"
          cp "$GITHUB_WORKSPACE/$MF_JAR_PATH" "jar/${MANGAFIRE_JAR_NAME}"
          cp "$GITHUB_WORKSPACE/$BC_APK_PATH" "apk/${BATCAVE_APK_NAME}"
          cp "$GITHUB_WORKSPACE/$BC_JAR_PATH" "jar/${BATCAVE_JAR_NAME}"
          python3 "$GITHUB_WORKSPACE/scripts/generate-tachimanga-repo.py" "$SIGNING_KEY_FINGERPRINT" .
          cat > README.md <<'EOF'
          # WavyKisuke TachiManga Extensions

          Recommended repository URL:
          `https://raw.githubusercontent.com/WavyKisuke/extensions-source/repo/repo.json`

          This repository publishes the MangaFire and BatCave TachiManga extensions as both APK and JAR packages.
          EOF
          git config user.name "WavyKisuke"
          git config user.email "327378209+WavyKisuke@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish MangaFire ${MANGAFIRE_VERSION_NAME} and BatCave ${BATCAVE_VERSION_NAME}"
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/repo

      # Keep the personal publisher triggerable from main after metadata changes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
