name: Publish personal TachiManga repo

on:
  push:
    branches:
      - main
    paths:
      - 'src/en/mangafire/**'
      - 'src/en/batcave/**'
      - 'src/en/asurascans/**'
      - 'scripts/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/publish-personal.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-tachimanga-repo
  cancel-in-progress: false

env:
  MANGAFIRE_VERSION_NAME: 1.6.15
  MANGAFIRE_SOURCE_VERSION_CODE: 15
  MANGAFIRE_ANDROID_VERSION_CODE: 106015
  MANGAFIRE_APK_NAME: tachiyomi-en.mangafire-v1.6.15.apk
  MANGAFIRE_JAR_NAME: tachiyomi-en.mangafire-v1.6.15.jar
  MANGAFIRE_PACKAGE: eu.kanade.tachiyomi.extension.en.mangafire

  BATCAVE_VERSION_NAME: 1.6.19
  BATCAVE_SOURCE_VERSION_CODE: 19
  BATCAVE_ANDROID_VERSION_CODE: 106019
  BATCAVE_APK_NAME: tachiyomi-en.batcave-v1.6.19.apk
  BATCAVE_JAR_NAME: tachiyomi-en.batcave-v1.6.19.jar
  BATCAVE_PACKAGE: eu.kanade.tachiyomi.extension.en.batcave

  ASURA_VERSION_NAME: 1.6.71
  ASURA_SOURCE_VERSION_CODE: 71
  ASURA_ANDROID_VERSION_CODE: 106071
  ASURA_APK_NAME: tachiyomi-en.asurascans-v1.6.71.apk
  ASURA_JAR_NAME: tachiyomi-en.asurascans-v1.6.71.jar
  ASURA_PACKAGE: eu.kanade.tachiyomi.extension.en.asurascans

jobs:
  build-and-publish:
    name: Build and publish Asura Scans (preserve existing extensions)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install protobuf runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade protobuf

      - name: Format sources
        run: ./gradlew :src:en:asurascans:spotlessApply --no-daemon

      - name: Build release APK and JAR packages
        run: ./gradlew :src:en:asurascans:clean :src:en:asurascans:assembleRelease --no-daemon --stacktrace

      - name: Verify Asura package
        shell: bash
        run: |
          set -euo pipefail
          AS_APK="$(find src/en/asurascans/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          AS_JAR="$(find src/en/asurascans/build/outputs/jar/release -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          test -n "$AS_APK" && test -n "$AS_JAR"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          BADGING="$("$AAPT" dump badging "$AS_APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='${ASURA_PACKAGE}'" >/dev/null
          echo "$BADGING" | grep -F "versionCode='${ASURA_ANDROID_VERSION_CODE}'" >/dev/null
          unzip -t "$AS_JAR" >/dev/null
          echo "AS_APK_PATH=$AS_APK" >> "$GITHUB_ENV"
          echo "AS_JAR_PATH=$AS_JAR" >> "$GITHUB_ENV"

      - name: Prepare TachiManga repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tachimanga-repo
          git clone --branch repo --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/tachimanga-repo
          cd /tmp/tachimanga-repo
          git fetch origin repo
          git checkout -B repo origin/repo
          mkdir -p apk jar
          cp "$GITHUB_WORKSPACE/$AS_APK_PATH" "apk/${ASURA_APK_NAME}"
          cp "$GITHUB_WORKSPACE/$AS_JAR_PATH" "jar/${ASURA_JAR_NAME}"
          SIGNING_KEY_FINGERPRINT="$(python3 -c 'import json; print(json.load(open("repo.json"))["meta"]["signingKeyFingerprint"])')"
          test -n "$SIGNING_KEY_FINGERPRINT"
          "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/scripts/generate-tachimanga-repo.py" "$SIGNING_KEY_FINGERPRINT" .
          cat > README.md <<'EOF'
          # WavyKisuke TachiManga Extensions

          Recommended repository URL:
          `https://raw.githubusercontent.com/WavyKisuke/extensions-source/repo/repo.json`

          This repository publishes the MangaFire, BatCave, and Asura Scans TachiManga extensions as both APK and JAR packages.
          EOF
          git config user.name "WavyKisuke"
          git config user.email "327378209+WavyKisuke@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish Asura Scans ${ASURA_VERSION_NAME} (preserve existing extensions)"
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/repo

      # Keep the personal publisher triggerable from main after metadata changes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
