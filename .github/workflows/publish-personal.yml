name: Publish personal TachiManga repo

on:
  push:
    branches:
      - main
    paths:
      - 'src/en/mangafire/**'
      - 'src/en/batcave/**'
      - 'src/en/batcave2/**'
      - 'src/en/asurascans/**'
      - 'scripts/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/publish-personal.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-tachimanga-repo
  cancel-in-progress: false

env:
  MANGAFIRE_VERSION_NAME: 1.6.16
  MANGAFIRE_SOURCE_VERSION_CODE: 16
  MANGAFIRE_ANDROID_VERSION_CODE: 106016
  MANGAFIRE_APK_NAME: tachiyomi-en.mangafire-v1.6.16.apk
  MANGAFIRE_JAR_NAME: tachiyomi-en.mangafire-v1.6.16.jar
  MANGAFIRE_PACKAGE: eu.kanade.tachiyomi.extension.en.mangafire

  BATCAVE_VERSION_NAME: 1.6.20
  BATCAVE_SOURCE_VERSION_CODE: 20
  BATCAVE_ANDROID_VERSION_CODE: 106020
  BATCAVE_APK_NAME: tachiyomi-en.batcave2-v1.6.20.apk
  BATCAVE_JAR_NAME: tachiyomi-en.batcave2-v1.6.20.jar
  BATCAVE_PACKAGE: eu.kanade.tachiyomi.extension.en.batcave2

  ASURA_VERSION_NAME: 1.6.71
  ASURA_SOURCE_VERSION_CODE: 71
  ASURA_ANDROID_VERSION_CODE: 106071
  ASURA_APK_NAME: tachiyomi-en.asurascans-v1.6.71.apk
  ASURA_JAR_NAME: tachiyomi-en.asurascans-v1.6.71.jar
  ASURA_PACKAGE: eu.kanade.tachiyomi.extension.en.asurascans

jobs:
  build-and-publish:
    name: Build and publish personal extensions (preserve existing assets)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install protobuf runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade protobuf

      - name: Format sources
        run: ./gradlew :src:en:asurascans:spotlessApply :src:en:mangafire:spotlessApply :src:en:batcave2:spotlessApply --no-daemon

      - name: Build all three release APK and JAR packages
        run: ./gradlew :src:en:asurascans:clean :src:en:asurascans:assembleRelease :src:en:mangafire:clean :src:en:mangafire:assembleRelease :src:en:batcave2:clean :src:en:batcave2:assembleRelease --no-daemon --stacktrace

      - name: Verify all extension packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          verify_package() {
            local module="$1" package="$2" version="$3" prefix="$4"
            local apk jar badging
            apk="$(find "src/$module/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
            jar="$(find "src/$module/build/outputs/jar/release" -maxdepth 1 -type f -name '*.jar' | head -n 1)"
            test -n "$apk" && test -n "$jar"
            badging="$("$AAPT" dump badging "$apk")"
            echo "$badging" | grep -F "package: name='$package'" >/dev/null
            echo "$badging" | grep -F "versionCode='$version'" >/dev/null
            unzip -t "$jar" >/dev/null
            echo "${prefix}_APK_PATH=$apk" >> "$GITHUB_ENV"
            echo "${prefix}_JAR_PATH=$jar" >> "$GITHUB_ENV"
            echo "Verified $module APK and JAR"
          }
          verify_package "en/asurascans" "$ASURA_PACKAGE" "$ASURA_ANDROID_VERSION_CODE" "AS"
          verify_package "en/mangafire" "$MANGAFIRE_PACKAGE" "$MANGAFIRE_ANDROID_VERSION_CODE" "MF"
          verify_package "en/batcave2" "$BATCAVE_PACKAGE" "$BATCAVE_ANDROID_VERSION_CODE" "BC"

      - name: Prepare TachiManga repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tachimanga-repo
          git clone --branch repo --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/tachimanga-repo
          cd /tmp/tachimanga-repo
          git fetch origin repo
          git checkout -B repo origin/repo
          mkdir -p apk jar
          cp "$GITHUB_WORKSPACE/$AS_APK_PATH" "apk/${ASURA_APK_NAME}"
          cp "$GITHUB_WORKSPACE/$AS_JAR_PATH" "jar/${ASURA_JAR_NAME}"
          cp "$GITHUB_WORKSPACE/$MF_APK_PATH" "apk/${MANGAFIRE_APK_NAME}"
          cp "$GITHUB_WORKSPACE/$MF_JAR_PATH" "jar/${MANGAFIRE_JAR_NAME}"
          cp "$GITHUB_WORKSPACE/$BC_APK_PATH" "apk/${BATCAVE_APK_NAME}"
          cp "$GITHUB_WORKSPACE/$BC_JAR_PATH" "jar/${BATCAVE_JAR_NAME}"
          SIGNING_KEY_FINGERPRINT="$(python3 -c 'import json; print(json.load(open("repo.json"))["meta"]["signingKeyFingerprint"])')"
          test -n "$SIGNING_KEY_FINGERPRINT"
          "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/scripts/generate-tachimanga-repo.py" "$SIGNING_KEY_FINGERPRINT" .
          cat > README.md <<'EOF'
          # WavyKisuke TachiManga Extensions

          Recommended repository URL:
          `https://raw.githubusercontent.com/WavyKisuke/extensions-source/repo/repo.json`

          This repository publishes the MangaFire, BatCave, and Asura Scans TachiManga extensions as both APK and JAR packages.
          EOF
          git config user.name "WavyKisuke"
          git config user.email "327378209+WavyKisuke@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish Asura Scans ${ASURA_VERSION_NAME} (preserve existing extensions)"
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/repo

      # Keep the personal publisher triggerable from main after metadata changes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
