name: Build Asura Scans

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/en/asurascans/**'
      - '.github/workflows/build-asurascans.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: read

concurrency:
  group: build-asurascans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Asura Scans extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s' "$SIGNING_KEY" | base64 -d > signingkey.jks
          fi

      - name: Build Asura Scans
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :src:en:asurascans:assembleRelease

      - name: Upload Asura Scans artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asura-scans-v71
          path: |
            src/en/asurascans/build/outputs/jar/release/*.jar
            src/en/asurascans/build/outputs/apk/release/*.apk
            src/en/asurascans/build/keiyoushi-source-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Clean up signing key
        if: always()
        run: rm -f signingkey.jks
